[package]
name = "aohoyo-native"
version = "0.4.0"
edition = "2021"
rust-version = "1.75"
description = "aohoyo 桌面端原生模块（Tauri）——机器指纹/风险检测/签名/安全存储/防多开/升级执行链"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
libc = "0.2"
# 升级执行链：HTTP 客户端（同步、rustls，无 tokio）+ MD5（sha2 家族）
ureq = "2"
md-5 = "0.10"
# 升级执行链：Windows zip 包解压自替换（仅 deflate，默认特性全关避免拖入无关格式）
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_Security",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
] }

[dev-dependencies]
serde_json = "1"
tiny_http = "0.12"
