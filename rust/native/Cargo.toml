[package]
name = "aohoyo-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "aohoyo 桌面端原生安全模块（Tauri）——机器指纹/风险检测/签名/安全存储/防多开"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_Security_Cryptography",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Diagnostics_Debug",
  "Win32_Security",
  "Win32_System_Memory",
] }

[dev-dependencies]
serde_json = "1"
